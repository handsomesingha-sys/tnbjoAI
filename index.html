<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173f35">
  <title>LINE AI STUDIO | ก๋วยเตี๋ยวโบราณ by เจ๊อ้น</title>

  <!-- External UI libraries -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --green-950: #102d26;
      --green-900: #173f35;
      --green-800: #205445;
      --green-700: #2d6a56;
      --green-100: #e8f2ed;
      --ink: #20312c;
      --muted: #718078;
      --line: #e5ebe7;
      --surface: #ffffff;
      --canvas: #f4f7f5;
      --danger: #b43e3e;
      --warning: #946014;
      --shadow: 0 12px 32px rgba(26, 57, 45, .07);
      --radius: 14px;
      --sidebar-width: 264px;
      --font: "TH Sarabun PSK", "TH Sarabun New", "Sarabun", Tahoma, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font);
      font-size: 19px;
      line-height: 1.35;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app-shell { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      z-index: 30;
      color: #eaf2ee;
      background: var(--green-950);
      transition: transform .2s ease;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 21px 18px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      color: var(--green-900);
      background: #dceee3;
      font-size: 22px;
    }
    .brand-title { font-size: 23px; font-weight: 700; line-height: 1; }
    .brand-subtitle { margin-top: 5px; color: #afc8bb; font-size: 15px; }
    .nav-scroll { flex: 1; overflow-y: auto; padding: 10px; }
    .nav-group { margin: 9px 0 16px; }
    .nav-label {
      padding: 8px 10px 5px;
      color: #8fa99d;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .05em;
    }
    .nav-link {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 2px 0;
      padding: 8px 11px;
      border: 0;
      border-radius: 9px;
      color: #d7e5de;
      background: transparent;
      text-align: left;
      font-size: 17px;
    }
    .nav-link i { width: 19px; text-align: center; color: #9db8ab; }
    .nav-link:hover { background: rgba(255,255,255,.08); }
    .nav-link.active { color: #fff; background: #2d6653; box-shadow: inset 3px 0 #a7d4ba; }
    .nav-link.active i { color: #d7f1e1; }
    .sidebar-footer {
      padding: 13px 18px;
      border-top: 1px solid rgba(255,255,255,.1);
      color: #a9c3b7;
      font-size: 14px;
    }

    .main { min-height: 100vh; margin-left: var(--sidebar-width); }
    .topbar {
      min-height: 72px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 11px 26px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(10px);
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; }
    .page-heading { font-size: 25px; font-weight: 700; }
    .page-subheading { color: var(--muted); font-size: 15px; }
    .agent-field { width: 140px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; }
    .connection-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: var(--muted);
      background: #fff;
      font-size: 14px;
      white-space: nowrap;
    }
    .connection-pill i { color: #26976c; font-size: 9px; }
    .mobile-menu { display: none !important; }
    .content { max-width: 1600px; margin: 0 auto; padding: 24px 26px 50px; }

    .page-toolbar, .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      flex-wrap: wrap;
    }
    .page-toolbar { margin-bottom: 16px; }
    .toolbar-left, .toolbar-right { justify-content: flex-start; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 7px 13px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-weight: 600;
      font-size: 16px;
      white-space: nowrap;
      transition: .15s ease;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { color: #fff; background: var(--green-800); }
    .btn-primary:hover { background: var(--green-900); }
    .btn-secondary { color: var(--ink); border-color: var(--line); background: #fff; }
    .btn-secondary:hover { background: #f4faf6; border-color: #cbdcd1; }
    .btn-danger { color: var(--danger); border-color: #f1d3d1; background: #fff5f4; }
    .btn-small { padding: 4px 9px; font-size: 14px; }
    .icon-btn {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
    }
    .icon-btn:hover { color: var(--green-800); background: #f4faf6; }
    .search-box { position: relative; min-width: 230px; }
    .search-box i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #87968e; }
    .search-box input { padding-left: 34px; }

    .grid { display: grid; gap: 15px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .panel, .stat-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 3px 12px rgba(24,55,42,.025);
    }
    .panel { padding: 17px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .panel-title { font-size: 21px; font-weight: 700; }
    .panel-description { color: var(--muted); font-size: 14px; }
    .stat-card { display: flex; justify-content: space-between; gap: 12px; padding: 17px; }
    .stat-label { color: var(--muted); font-size: 16px; }
    .stat-value { margin-top: 4px; font-size: 32px; font-weight: 700; line-height: 1.15; }
    .stat-icon {
      width: 43px; height: 43px; display: grid; place-items: center;
      border-radius: 11px; color: var(--green-800); background: var(--green-100);
    }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }
    .empty { padding: 35px 14px; color: var(--muted); text-align: center; }
    .empty i { display: block; margin-bottom: 8px; color: #9eada4; font-size: 27px; }
    .empty strong { display: block; color: var(--ink); font-size: 19px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th, td { padding: 9px 11px; border-bottom: 1px solid #edf1ee; text-align: left; vertical-align: middle; }
    th { color: #687970; background: #fafcfb; font-size: 14px; white-space: nowrap; }
    td { font-size: 16px; }
    tbody tr:hover { background: #fbfdfc; }
    .table-actions { display: flex; align-items: center; gap: 5px; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 99px;
      color: #536359;
      background: #eef2ef;
      font-size: 13px;
      white-space: nowrap;
    }
    .badge.success { color: #1f7453; background: #e7f5ed; }
    .badge.warning { color: #946014; background: #fff4df; }
    .badge.danger { color: #a33939; background: #ffeded; }
    .badge.info { color: #2e668f; background: #eaf3fa; }

    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #56665d; font-size: 15px; font-weight: 600; }
    .field input, .field select, .field textarea, .control {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #dce5df;
      border-radius: 8px;
      outline: none;
      color: var(--ink);
      background: #fff;
    }
    .field textarea, textarea.control { min-height: 100px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus, .control:focus {
      border-color: #78a78c;
      box-shadow: 0 0 0 3px rgba(65,135,97,.1);
    }
    .field-help { color: var(--muted); font-size: 13px; }
    .check-row { display: flex; align-items: center; gap: 8px; color: #58685f; }
    .check-row input { accent-color: var(--green-700); }
    .notice {
      padding: 11px 13px;
      border: 1px solid #d9e8df;
      border-radius: 10px;
      color: #375747;
      background: #f3f9f5;
      font-size: 15px;
    }
    .notice.warning { border-color: #f0dfc7; color: #83591c; background: #fff8ed; }
    .divider { height: 1px; margin: 13px 0; background: var(--line); }

    .split-layout { display: grid; grid-template-columns: 320px minmax(0,1fr); gap: 14px; min-height: 560px; }
    .chat-panel { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .chat-list { max-height: 690px; overflow: auto; }
    .chat-list-item { display: flex; gap: 10px; padding: 11px; border-bottom: 1px solid #edf1ee; cursor: pointer; }
    .chat-list-item:hover, .chat-list-item.selected { background: #f2f8f4; }
    .avatar {
      width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 auto;
      overflow: hidden; border-radius: 50%; color: var(--green-800); background: #e7f0eb;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-list-main { flex: 1; min-width: 0; }
    .chat-list-top { display: flex; justify-content: space-between; gap: 6px; }
    .chat-name { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .chat-preview { overflow: hidden; color: var(--muted); font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .chat-thread { display: flex; flex-direction: column; min-height: 560px; }
    .chat-thread-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .chat-messages { flex: 1; min-height: 340px; max-height: 540px; padding: 16px; overflow: auto; background: #f8faf8; }
    .message-row { display: flex; margin: 9px 0; }
    .message-row.outgoing { justify-content: flex-end; }
    .bubble {
      max-width: min(78%,620px); padding: 9px 12px; border: 1px solid #e5ece7;
      border-radius: 13px; background: #fff; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .message-row.outgoing .bubble { border-color: #d6e8dc; background: #e6f3eb; }
    .message-meta { margin-top: 4px; color: #7b8981; font-size: 12px; }
    .chat-composer { padding: 11px; border-top: 1px solid var(--line); background: #fff; }
    .chat-composer textarea { min-height: 60px; max-height: 150px; }
    .chat-composer-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 7px; }

    .welcome-item { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
    .sequence-number { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--green-800); background: var(--green-100); font-weight: 700; }
    .template-card, .image-card { padding: 13px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
    .template-preview { max-height: 250px; overflow: auto; padding: 10px; border: 1px solid #dce7df; border-radius: 9px; background: #f8fbf9; }
    .image-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(170px,1fr)); gap: 12px; }
    .image-card img { width: 100%; height: 125px; object-fit: cover; border-radius: 7px; background: #f0f3f1; }
    .hidden { display: none !important; }

    @media (max-width: 1100px) {
      .grid-4 { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .split-layout { grid-template-columns: 280px minmax(0,1fr); }
    }
    @media (max-width: 820px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .mobile-backdrop.visible { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(9,26,20,.45); }
      .main { margin-left: 0; }
      .mobile-menu { display: inline-grid !important; }
      .topbar { padding: 10px 13px; }
      .content { padding: 17px 13px 35px; }
      .split-layout { grid-template-columns: 1fr; }
      .chat-list { max-height: 210px; }
      .connection-pill { display: none; }
    }
    @media (max-width: 560px) {
      .grid-2, .grid-3, .grid-4, .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .page-heading { font-size: 21px; }
      .agent-wrap { display: none; }
      .search-box { min-width: 100%; }
      .toolbar-left, .toolbar-right { width: 100%; }
      .toolbar-left > *, .toolbar-right > * { flex: 1; }
      .welcome-item { grid-template-columns: 34px minmax(0,1fr); }
      .welcome-item .item-actions { grid-column: 2; }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><i class="fa-solid fa-bowl-food"></i></div>
        <div>
          <div class="brand-title">LINE AI STUDIO</div>
          <div class="brand-subtitle">ก๋วยเตี๋ยวโบราณ by เจ๊อ้น</div>
        </div>
      </div>

      <nav class="nav-scroll" id="navigation">
        <div class="nav-group">
          <div class="nav-label">ภาพรวม</div>
          <button class="nav-link active" data-page="dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</button>
        </div>
        <div class="nav-group">
          <div class="nav-label">AI และข้อความ</div>
          <button class="nav-link" data-page="ai"><i class="fa-solid fa-robot"></i> AI Assistant</button>
          <button class="nav-link" data-page="prompts"><i class="fa-solid fa-terminal"></i> Prompt Management</button>
          <button class="nav-link" data-page="knowledge"><i class="fa-solid fa-book-open"></i> Knowledge Base</button>
          <button class="nav-link" data-page="faq"><i class="fa-regular fa-circle-question"></i> FAQ</button>
          <button class="nav-link" data-page="playground"><i class="fa-solid fa-flask"></i> AI Playground</button>
          <button class="nav-link" data-page="welcome"><i class="fa-solid fa-handshake"></i> Welcome Message</button>
          <button class="nav-link" data-page="flex"><i class="fa-regular fa-message"></i> Flex Message Builder</button>
        </div>
        <div class="nav-group">
          <div class="nav-label">LINE และลูกค้า</div>
          <button class="nav-link" data-page="members"><i class="fa-solid fa-users"></i> สมาชิก LINE</button>
          <button class="nav-link" data-page="chat"><i class="fa-solid fa-comments"></i> Live Chat</button>
          <button class="nav-link" data-page="handover"><i class="fa-solid fa-headset"></i> คิวเจ้าหน้าที่</button>
          <button class="nav-link" data-page="broadcast"><i class="fa-solid fa-paper-plane"></i> Broadcast</button>
          <button class="nav-link" data-page="richmenus"><i class="fa-solid fa-table-cells-large"></i> Rich Menu</button>
        </div>
        <div class="nav-group">
          <div class="nav-label">ระบบร้านอาหาร</div>
          <button class="nav-link" data-page="menu"><i class="fa-solid fa-utensils"></i> เมนูอาหาร</button>
          <button class="nav-link" data-page="images"><i class="fa-regular fa-images"></i> คลังรูปภาพ</button>
          <button class="nav-link" data-page="orders"><i class="fa-solid fa-receipt"></i> จัดการออเดอร์</button>
          <button class="nav-link" data-page="keywords"><i class="fa-solid fa-filter"></i> Keyword Rules</button>
          <button class="nav-link" data-page="automations"><i class="fa-solid fa-gears"></i> Automation</button>
          <button class="nav-link" data-page="flow"><i class="fa-solid fa-diagram-project"></i> Conversation Flow</button>
        </div>
        <div class="nav-group">
          <div class="nav-label">ผู้ดูแลและรายงาน</div>
          <button class="nav-link" data-page="staff"><i class="fa-solid fa-user-tie"></i> พนักงานและกลุ่ม LINE</button>
          <button class="nav-link" data-page="reports"><i class="fa-solid fa-chart-pie"></i> Reports</button>
          <button class="nav-link" data-page="logs"><i class="fa-solid fa-clipboard-list"></i> System Logs</button>
          <button class="nav-link" data-page="database"><i class="fa-solid fa-database"></i> Database Manager</button>
          <button class="nav-link" data-page="settings"><i class="fa-solid fa-sliders"></i> ตั้งค่าระบบ</button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div><i class="fa-solid fa-shield-halved"></i> Management Console</div>
        <div>Apps Script · Version 1.0</div>
      </div>
    </aside>

    <div class="mobile-backdrop" id="mobileBackdrop"></div>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="เปิดเมนู">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <div class="page-heading" id="pageTitle">Dashboard</div>
            <div class="page-subheading" id="pageSubtitle">ภาพรวมการทำงานของร้านและระบบ LINE AI</div>
          </div>
        </div>
        <div class="topbar-right">
          <span class="connection-pill" id="connectionStatus"><i class="fa-solid fa-circle"></i> กำลังตรวจสอบระบบ</span>
          <label class="agent-wrap small muted">
            ผู้ให้บริการ
            <input class="agent-field" id="agentName" value="Ponlabat">
          </label>
          <button class="icon-btn" id="apiConfigButton" title="ตั้งค่าการเชื่อมต่อ Google Apps Script API"><i class="fa-solid fa-link"></i></button>
          <button class="icon-btn" id="refreshButton" title="รีเฟรชข้อมูล"><i class="fa-solid fa-rotate"></i></button>
        </div>
      </header>
      <section class="content" id="pageContent">
        <div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><strong>กำลังโหลดระบบ</strong></div>
      </section>
    </main>
  </div>

  <script>
    "use strict";

    /*
      FRONTEND DEPLOYMENT
      - This file is hosted on GitHub Pages (not inside Apps Script).
      - Backend is the standalone Code.gs Google Apps Script Web App.
      - Enter the apiUrl returned by setupSystem() in the API configuration dialog.
      - Requests use form POST -> hidden iframe -> postMessage as implemented in Code.gs.
      - Do not add LINE/Gemini/ImgBB secrets to this repository.
    */

    /* -----------------------------------------------------------------------
       State, navigation and API bridge
       -------------------------------------------------------------------- */

    const state = {
      page: "dashboard",
      selectedMembers: new Set(),
      members: [],
      flexTemplates: [],
      menuItems: [],
      categories: [],
      welcomeMessages: [],
      chatUserId: "",
      chatMode: "AI",
      chatRefreshTimer: null
    };

    const PAGE_META = {
      dashboard: ["Dashboard", "ภาพรวมการทำงานของร้านและระบบ LINE AI"],
      ai: ["AI Assistant", "กำหนดพฤติกรรมและการทำงานของผู้ช่วย AI"],
      prompts: ["Prompt Management", "จัดการ System Prompt และประวัติเวอร์ชัน"],
      knowledge: ["Knowledge Base", "จัดการข้อมูลที่ AI ใช้อ้างอิง"],
      faq: ["FAQ", "จัดการคำถามและคำตอบที่พบบ่อย"],
      playground: ["AI Playground", "ตรวจสอบการเชื่อมต่อ Gemini"],
      welcome: ["Welcome Message", "กำหนดชุดข้อความต้อนรับเพื่อนใหม่"],
      flex: ["Flex Message Builder", "สร้างและจัดการ Flex Message"],
      members: ["สมาชิก LINE", "ดูรายชื่อ ค้นหา เลือกสมาชิก และส่ง Flex"],
      chat: ["Live Chat", "สนทนากับลูกค้าและสลับ AI / เจ้าหน้าที่"],
      handover: ["คิวเจ้าหน้าที่", "จัดการคำขอติดต่อเจ้าหน้าที่และ Timeout"],
      broadcast: ["Broadcast", "ส่งข้อความไปยังสมาชิกที่เลือก"],

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function parseJson(value, fallback = {}) {
      if (value && typeof value === "object") return value;
      try { return JSON.parse(value || ""); } catch (error) { return fallback; }
    }

      return Number(value || 0).toLocaleString("th-TH", {

        maximumFractionDigits: 2
      }) + " บาท";

    function dateTime(value) {
      if (!value) return "-";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString("th-TH", {
        dateStyle: "medium", timeStyle: "short"
      });

    /* -----------------------------------------------------------------------
       GitHub -> Google Apps Script API bridge
       Contract from Code.gs:
       POST {api=1, action, payload, requestId, apiKey}
       Code.gs responds with an HTML page that postMessages:
       {channel:"LINE_AI_STUDIO_API", requestId, result}
       -------------------------------------------------------------------- */

    const API_STORAGE_KEYS = {
      endpoint: "LINE_AI_STUDIO_API_ENDPOINT",
      apiKey: "LINE_AI_STUDIO_DASHBOARD_API_KEY"
    };
    const API_MESSAGE_CHANNEL = "LINE_AI_STUDIO_API";
    const API_DEFAULT_TIMEOUT = 210000;
    const apiPendingRequests = new Map();

    function readClientApiConfig() {
      return {
        endpoint: localStorage.getItem(API_STORAGE_KEYS.endpoint) || "",
        apiKey: localStorage.getItem(API_STORAGE_KEYS.apiKey) || ""
      };
    }

    function normalizeApiEndpoint(value) {
      const raw = String(value || "").trim();
      if (!raw) throw new Error("กรุณาระบุ Web App API URL จาก setupSystem() ใน Code.gs");
      let url;
      try {
        url = new URL(raw);
      } catch (error) {
        throw new Error("รูปแบบ API URL ไม่ถูกต้อง");
      }
      if (url.protocol !== "https:") throw new Error("API URL ต้องเป็น HTTPS");
      if (!/script\.google\.com$/i.test(url.hostname) || !url.pathname.includes("/macros/s/")) {
        throw new Error("กรุณาใช้ Web App URL จาก Google Apps Script ที่ลงท้ายด้วย /exec");
      }
      url.searchParams.set("api", "1");
      url.searchParams.delete("hook");
      return url.toString();
    }

    function getApiEndpoint() {
      return localStorage.getItem(API_STORAGE_KEYS.endpoint) || "";
    }

    function getApiKey() {
      return localStorage.getItem(API_STORAGE_KEYS.apiKey) || "";
    }

    function makeRequestId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return "req_" + window.crypto.randomUUID().replace(/-/g, "");
      }
      return "req_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 14);
    }

    function removeApiRequest(requestId) {
      const pending = apiPendingRequests.get(requestId);
      if (!pending) return;
      clearTimeout(pending.timeoutId);
      if (pending.form && pending.form.parentNode) pending.form.parentNode.removeChild(pending.form);
      if (pending.iframe && pending.iframe.parentNode) pending.iframe.parentNode.removeChild(pending.iframe);
      apiPendingRequests.delete(requestId);
    }

    window.addEventListener("message", event => {
      const message = event.data;
      if (!message || message.channel !== API_MESSAGE_CHANNEL || !message.requestId) return;
      const pending = apiPendingRequests.get(String(message.requestId));
      if (!pending || event.source !== pending.iframe.contentWindow) return;

      const result = message.result || {};
      removeApiRequest(String(message.requestId));
      if (result && result.ok === false) {
        let messageText = result.error || "Backend ไม่สามารถดำเนินการได้";
        if (result.hint && !messageText.includes(result.hint)) messageText += String.fromCharCode(10) + result.hint;
        pending.reject(new Error(messageText));
      } else {
        pending.resolve(result);
      }
    });

    function callApi(action, payload = {}, options = {}) {
      return new Promise((resolve, reject) => {
        let endpoint;
        try {
          endpoint = normalizeApiEndpoint(getApiEndpoint());
        } catch (error) {
          reject(error);
          return;
        }

        const requestId = makeRequestId();
        const frameName = "line_ai_api_frame_" + requestId;
        const iframe = document.createElement("iframe");
        iframe.name = frameName;
        iframe.title = "API response frame";
        iframe.setAttribute("aria-hidden", "true");
        iframe.tabIndex = -1;
        iframe.style.cssText = "position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;border:0;visibility:hidden;";

        const form = document.createElement("form");
        form.method = "POST";
        form.action = endpoint;
        form.target = frameName;
        form.acceptCharset = "UTF-8";
        form.enctype = "application/x-www-form-urlencoded";
        form.style.display = "none";

        const fields = {
          action: String(action || ""),
          payload: JSON.stringify(payload || {}),
          requestId: requestId,
          apiKey: getApiKey()
        };
        Object.keys(fields).forEach(name => {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = name;
          input.value = fields[name];
          form.appendChild(input);
        });

        const timeoutMs = Number(options.timeoutMs || API_DEFAULT_TIMEOUT);
        const timeoutId = setTimeout(() => {
          removeApiRequest(requestId);
          reject(new Error("หมดเวลารอ API ตอบกลับ กรุณาตรวจสอบการ Deploy และการเชื่อมต่อ แล้วลองอีกครั้ง"));
        }, timeoutMs);

        apiPendingRequests.set(requestId, {
          iframe: iframe,
          form: form,
          timeoutId: timeoutId,
          resolve: resolve,
          reject: reject
        });

        document.body.appendChild(iframe);
        document.body.appendChild(form);
        try {
          form.submit();
        } catch (error) {
          removeApiRequest(requestId);
          reject(error);
        }
      });
    }

              <div class="field-help">เก็บไว้ใน Local Storage ของเบราว์เซอร์นี้ ไม่ถูกเขียนลงไฟล์ GitHub อย่างไรก็ตามห้ามใช้เป็นมาตรการความปลอดภัยสำหรับเว็บไซต์สาธารณะ</div>
            </div>
          </div>`,
        showCancelButton: true,
        confirmButtonText: "บันทึกและทดสอบการเชื่อมต่อ",
        cancelButtonText: "ยกเลิก",
        confirmButtonColor: "#205445",

      if (!testAfterSave) return true;
      Swal.fire({

      try {
        const status = await callApi("system.status", {}, {timeoutMs: 60000});
        Swal.fire({
          icon: "success",

          text: status.databaseReady ? "เชื่อมต่อ Backend และพบฐานข้อมูลแล้ว" : "เชื่อมต่อ Backend ได้แล้ว แต่ยังไม่พบฐานข้อมูล กรุณารัน setupSystem() ใน Apps Script",
          confirmButtonColor: "#205445"
        });

    function statusBadge(value) {
      const key = String(value || "").toUpperCase();
      const map = {
        AI: ["AI ดูแล", "success"], HUMAN: ["แอดมินดูแล", "info"],
        WAITING: ["รอเจ้าหน้าที่", "warning"], PAUSED: ["หยุดชั่วคราว", ""],
        CLOSED: ["ปิดแชท", ""], NEW: ["ออเดอร์ใหม่", "warning"],
        ACCEPTED: ["รับออเดอร์แล้ว", "info"], COOKING: ["กำลังจัดเตรียม", "info"],
        READY: ["พร้อมรับอาหาร", "success"], COMPLETED: ["เสร็จสิ้น", "success"],
        CANCELLED: ["ยกเลิก", "danger"], SENT: ["ส่งแล้ว", "success"],
        FAILED: ["ไม่สำเร็จ", "danger"], ERROR: ["ERROR", "danger"],
        WARN: ["WARNING", "warning"], INFO: ["INFO", "info"],
        QUEUED: ["อยู่ในคิว", "warning"], SCHEDULED: ["ตั้งเวลาแล้ว", "info"]
      };
      const item = map[key] || [value || "-", ""];
      return `<span class="badge ${item[1]}">${escapeHtml(item[0])}</span>`;
    }

    function panel(title, description, content, actions = "") {
      return `<section class="panel">

          ${actions}
        </div>
        ${content}
      </section>`;

    function tableHtml(headers, rows, emptyText = "ยังไม่มีข้อมูล") {
      if (!rows.length) {
        return `<div class="empty"><i class="fa-regular fa-folder-open"></i><strong>${emptyText}</strong></div>`;
      }
      return `<div class="table-wrap"><table>
        <thead><tr>${headers.map(header => `<th>${header}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody>
      </table></div>`;
    }

    function field(label, name, value = "", type = "text", options = {}) {
      const full = options.full ? "full" : "";
      const required = options.required ? "required" : "";
      if (type === "textarea") {
        return `<div class="field ${full}">
          <label for="${name}">${label}</label>
          <textarea id="${name}" name="${name}" ${required}>${escapeHtml(value)}</textarea>
          ${options.help ? `<div class="field-help">${options.help}</div>` : ""}
        </div>`;
      }
      if (type === "select") {
        const optionHtml = (options.options || []).map(item => {
          const optionValue = typeof item === "string" ? item : item.value;
          const optionLabel = typeof item === "string" ? item : item.label;
          return `<option value="${escapeHtml(optionValue)}" ${String(optionValue) === String(value) ? "selected" : ""}>${escapeHtml(optionLabel)}</option>`;
        }).join("");
        return `<div class="field ${full}">
          <label for="${name}">${label}</label>
          <select id="${name}" name="${name}" ${required}>${optionHtml}</select>
          ${options.help ? `<div class="field-help">${options.help}</div>` : ""}
        </div>`;
      }
      return `<div class="field ${full}">
        <label for="${name}">${label}</label>
        <input id="${name}" name="${name}" type="${type}" value="${escapeHtml(value)}" ${required}>
        ${options.help ? `<div class="field-help">${options.help}</div>` : ""}
      </div>`;
    }

    function checkbox(label, name, checked) {
      return `<label class="check-row"><input type="checkbox" name="${name}" ${checked ? "checked" : ""}> ${label}</label>`;
    }

    function formValues(form) {
      const result = {};
      new FormData(form).forEach((value, key) => { result[key] = value; });
      $$('input[type="checkbox"]', form).forEach(input => { result[input.name] = input.checked; });
      return result;
    }

    function welcomeItemMarkup(item, index) {
      const payload = item.payload || parseJson(item.payloadJson, {});
      const type = item.messageType || payload.type || "text";
      const typeName = type === "flex" ? "Flex Message" : type === "image" ? "รูปภาพ" : "ข้อความ";
      let preview = type === "text" ? payload.text : type === "image" ? payload.originalContentUrl : (payload.altText || "Flex Contents");
      return `<div class="welcome-item" data-welcome-index="${index}">
        <div class="sequence-number">${index + 1}</div>
        <div>
          <strong>${typeName}</strong>
          <div class="small muted">${escapeHtml(String(preview || "").slice(0, 110))}</div>
          <input type="hidden" class="welcome-id" value="${escapeHtml(item.welcomeMessageId || "")}">
          <input type="hidden" class="welcome-type" value="${escapeHtml(type)}">
          <textarea class="welcome-payload hidden">${escapeHtml(JSON.stringify(payload))}</textarea>
          <label class="check-row small"><input class="welcome-active" type="checkbox" ${item.active === false ? "" : "checked"}> เปิดใช้งาน</label>
        </div>
        <div class="item-actions table-actions">
          <button class="icon-btn" data-welcome-edit="${index}" title="แก้ไข"><i class="fa-solid fa-pen"></i></button>
          <button class="icon-btn" data-welcome-up="${index}" title="เลื่อนขึ้น"><i class="fa-solid fa-arrow-up"></i></button>
          <button class="icon-btn" data-welcome-down="${index}" title="เลื่อนลง"><i class="fa-solid fa-arrow-down"></i></button>
          <button class="icon-btn" data-welcome-remove="${index}" title="ลบ"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      </div>`;
    }

    function readWelcomeItems() {
      return $$(".welcome-item", $("#welcomeItems")).map((element, index) => ({
        welcomeMessageId: $(".welcome-id", element).value,
        sequence: index + 1,
        messageType: $(".welcome-type", element).value,
        payload: parseJson($(".welcome-payload", element).value, {}),
        active: $(".welcome-active", element).checked
      }));
    }

    function bindWelcomeActions() {
      $$("[data-welcome-edit]").forEach(button => button.addEventListener("click", () => {
        editWelcomeItem(Number(button.dataset.welcomeEdit));
      }));
      $$("[data-welcome-remove]").forEach(button => button.addEventListener("click", () => {
        const items = readWelcomeItems();
        items.splice(Number(button.dataset.welcomeRemove), 1);
        $("#welcomeItems").innerHTML = items.length
          ? items.map(welcomeItemMarkup).join("")
          : '<div class="empty"><i class="fa-regular fa-message"></i><strong>ยังไม่มีข้อความต้อนรับ</strong></div>';
        bindWelcomeActions();
      }));
      $$("[data-welcome-up], [data-welcome-down]").forEach(button => button.addEventListener("click", () => {
        const index = Number(button.dataset.welcomeUp || button.dataset.welcomeDown);
        const target = index + (button.hasAttribute("data-welcome-up") ? -1 : 1);
        const items = readWelcomeItems();
        if (target < 0 || target >= items.length) return;
        [items[index], items[target]] = [items[target], items[index]];
        $("#welcomeItems").innerHTML = items.map(welcomeItemMarkup).join("");
        bindWelcomeActions();
      }));
    }

    async function addWelcomeItem(type) {
      let payload;
      if (type === "text") {
        const result = await Swal.fire({
          title: "เพิ่มข้อความต้อนรับ",
          input: "textarea",
          inputPlaceholder: "พิมพ์ข้อความต้อนรับ",
          showCancelButton: true,
          confirmButtonText: "เพิ่มข้อความ",
          cancelButtonText: "ยกเลิก",
          confirmButtonColor: "#205445"
        });
        if (!result.isConfirmed || !result.value) return;
        payload = {type:"text", text:result.value};
      } else if (type === "image") {
        const result = await modalForm("เพิ่มรูปภาพ", `
          ${field("Original Content URL (HTTPS)", "originalContentUrl", "", "url", {full:true,required:true})}
          ${field("Preview Image URL (HTTPS)", "previewImageUrl", "", "url", {full:true,required:true})}
        `);
        if (!result) return;
        payload = {type:"image", originalContentUrl:result.originalContentUrl, previewImageUrl:result.previewImageUrl};
      } else {
        const defaultContents = {
          type:"bubble",
          body:{type:"box",layout:"vertical",contents:[
            {type:"text",text:"ก๋วยเตี๋ยวโบราณ by เจ๊อ้น",weight:"bold",size:"xl"},
            {type:"text",text:"ยินดีต้อนรับและขอบคุณที่เพิ่มเพื่อน",wrap:true,margin:"md"}
          ]}
        };
        const result = await modalForm("เพิ่ม Flex Message", `
          ${field("Alt Text", "altText", "ข้อความต้อนรับจากร้าน", "text", {full:true})}
          ${field("Flex Contents JSON", "contentsJson", JSON.stringify(defaultContents,null,2), "textarea", {full:true,required:true})}
        `);
        if (!result) return;
        const contents = parseJson(result.contentsJson, null);
        if (!contents) return showError(new Error("Flex JSON ไม่ถูกต้อง"));
        payload = {type:"flex", altText:result.altText, contents};
      }
      const items = readWelcomeItems();
      items.push({sequence:items.length+1,messageType:type,payload,active:true});
      $("#welcomeItems").innerHTML = items.map(welcomeItemMarkup).join("");
      bindWelcomeActions();
    }

    async function editWelcomeItem(index) {
      const items = readWelcomeItems();
      const item = items[index];
      if (!item) return;
      let fieldsHtml = "";
      if (item.messageType === "text") {
        fieldsHtml = field("ข้อความ", "text", item.payload.text || "", "textarea", {full:true,required:true});
      } else if (item.messageType === "image") {
        fieldsHtml = field("Original Content URL", "originalContentUrl", item.payload.originalContentUrl || "", "url", {full:true,required:true}) +
          field("Preview Image URL", "previewImageUrl", item.payload.previewImageUrl || "", "url", {full:true,required:true});
      } else {
        fieldsHtml = field("Alt Text", "altText", item.payload.altText || "", "text", {full:true}) +
          field("Flex Contents JSON", "contentsJson", JSON.stringify(item.payload.contents || {},null,2), "textarea", {full:true,required:true});
      }
      const result = await modalForm("แก้ไขข้อความต้อนรับ", fieldsHtml);
      if (!result) return;
      if (item.messageType === "text") item.payload.text = result.text;
      if (item.messageType === "image") {
        item.payload.originalContentUrl = result.originalContentUrl;
        item.payload.previewImageUrl = result.previewImageUrl;
      }
      if (item.messageType === "flex") {
        item.payload.altText = result.altText;
        item.payload.contents = parseJson(result.contentsJson, null);
        if (!item.payload.contents) return showError(new Error("Flex JSON ไม่ถูกต้อง"));
      }
      items[index] = item;
      $("#welcomeItems").innerHTML = items.map(welcomeItemMarkup).join("");
      bindWelcomeActions();
    }

    async function saveWelcome() {
      const formData = formValues($("#welcomeSettings"));
      formData.maxReplyMessages = Math.min(5, Math.max(1, Number(formData.maxReplyMessages || 5)));
      const messages = readWelcomeItems();
      if (messages.length > formData.maxReplyMessages) {
        return showError(new Error("จำนวนข้อความเกินขีดจำกัดที่กำหนด"));
      }
      await callApi("welcome.save", {settings:formData,messages});
      notify("บันทึกชุดข้อความต้อนรับแล้ว");
    }

    async function sendFlex(templateId) {

    async function chooseFlexForMembers() {
      if (!state.selectedMembers.size) {
        return showError(new Error("กรุณาเลือกสมาชิกอย่างน้อย 1 คน"));
      }
      const result = await callApi("flex.list", {activeOnly:true});
      const templates = result.templates || [];
      if (!templates.length) return showError(new Error("ยังไม่มี Flex Template"));
      const selectOptions = Object.fromEntries(templates.map(item => [item.templateId,item.name]));
      const selected = await Swal.fire({
        title:"เลือก Flex Message",
        input:"select",
        inputOptions:selectOptions,
        inputPlaceholder:"เลือก Template",
        showCancelButton:true,
        confirmButtonText:"ส่งให้สมาชิก",
        cancelButtonText:"ยกเลิก",
        confirmButtonColor:"#205445"
      });
      if (!selected.isConfirmed || !selected.value) return;
      if (!(await confirmAction("ยืนยันส่ง Flex", `ส่งให้สมาชิก ${state.selectedMembers.size} คนหรือไม่`, "ส่งข้อความ"))) return;
      const sent = await callApi("flex.send", {
        userIds:Array.from(state.selectedMembers),
        templateId:selected.value
      });
      Swal.fire({
        icon:sent.failed ? "warning" : "success",

        text:`ส่งสำเร็จ ${sent.sent || 0} คน · ไม่สำเร็จ ${sent.failed || 0} คน`
      });
    }

    async function renderChat(root) {
      const result = await callApi("chat.list", {limit:200});
      const chats = result.chats || [];
      if (state.chatRefreshTimer) clearInterval(state.chatRefreshTimer);
      root.innerHTML = `

          <section class="chat-panel">
            <div class="panel-header" style="padding:12px;border-bottom:1px solid var(--line);margin:0">

              <button class="icon-btn" id="refreshChatList" title="รีเฟรช"><i class="fa-solid fa-rotate"></i></button>
            </div>
            <div class="chat-list" id="chatList">
              ${chats.map(chatListItem).join("") || '<div class="empty"><strong>ยังไม่มีบทสนทนา</strong></div>'}
            </div>
          </section>
          <section class="chat-panel chat-thread" id="chatThread">

          </section>
        </div>`;
      $("#refreshChatList").addEventListener("click", refreshChatList);
      bindChatList();
      if (state.chatUserId) {
        const current = chats.find(item => item.userId === state.chatUserId);
        if (current) await openChat(state.chatUserId);
      }
      state.chatRefreshTimer = setInterval(async () => {
        await refreshChatList();
        await refreshActiveChatMessages();
      }, 10000);
    }

    async function refreshActiveChatMessages() {
      if (state.page !== "chat" || !state.chatUserId || !$("#chatMessages")) return;
      try {
        const result = await callApi("chat.messages", {userId:state.chatUserId,limit:100});
        const messages = result.messages || [];
        const currentLast = state.chatMessages.length
          ? state.chatMessages[state.chatMessages.length - 1].messageId
          : "";
        const nextLast = messages.length ? messages[messages.length - 1].messageId : "";
        if (currentLast !== nextLast || messages.length !== state.chatMessages.length) {
          state.chatMessages = messages;
          const container = $("#chatMessages");
          if (container) {
            container.innerHTML = messages.map(messageMarkup).join("");
            container.scrollTop = container.scrollHeight;
          }
        }
      } catch (error) {
        console.warn("Active chat refresh failed", error);
      }
    }

    function chatListItem(chat) {
      const member = chat.member || {};
      const name = member.displayName || chat.userId;
      return `<div class="chat-list-item ${state.chatUserId === chat.userId ? "selected" : ""}" data-chat-user="${escapeHtml(chat.userId)}">
        <div class="avatar">${member.pictureUrl ? safeImage(member.pictureUrl,name) : '<i class="fa-solid fa-user"></i>'}</div>
        <div class="chat-list-main">
          <div class="chat-list-top"><span class="chat-name">${escapeHtml(name)}</span><span class="small muted">${dateTime(chat.lastMessageAt)}</span></div>
          <div class="chat-preview">${escapeHtml(chat.assignedAgent || chat.replyMode || "AI")}</div>
          ${statusBadge(chat.replyMode)}
        </div>
      </div>`;
    }

    function bindChatList() {
      $$("[data-chat-user]").forEach(item => item.addEventListener("click", () => openChat(item.dataset.chatUser)));
    }

    async function refreshChatList() {
      if (state.page !== "chat") return;
      try {
        const result = await callApi("chat.list", {limit:200});
        $("#chatList").innerHTML = (result.chats || []).map(chatListItem).join("") || '<div class="empty">ยังไม่มีบทสนทนา</div>';
        bindChatList();
      } catch (error) {
        console.warn("Chat list refresh failed", error);
      }
    }

    async function openChat(userId) {
      state.chatUserId = userId;
      const [listResult, messageResult] = await Promise.all([
        callApi("chat.list", {limit:200}),
        callApi("chat.messages", {userId,limit:100})
      ]);
      const chat = (listResult.chats || []).find(item => item.userId === userId) || {userId,replyMode:"AI"};
      state.chatMode = chat.replyMode || "AI";
      state.chatMessages = messageResult.messages || [];
      renderChatThread(chat);
      $$(".chat-list-item").forEach(item => item.classList.toggle("selected", item.dataset.chatUser === userId));
    }

    function messageMarkup(message) {
      const sender = String(message.senderType || "").toUpperCase();
      const outgoing = ["ADMIN","AI","BOT"].includes(sender);
      const text = message.text || (message.messageType === "image" ? "[รูปภาพ]" : `[${message.messageType || "message"}]`);
      return `<div class="message-row ${outgoing ? "outgoing" : ""}">
        <div class="bubble">
          <div class="small muted">${escapeHtml(message.senderName || sender)}</div>
          ${escapeHtml(text)}
          <div class="message-meta">${dateTime(message.createdAt)} · ${escapeHtml(message.deliveryStatus || "")}</div>
        </div>
      </div>`;
    }

    function renderChatThread(chat) {
      const member = chat.member || {};
      const human = chat.replyMode === "HUMAN";
      const thread = $("#chatThread");
      if (!thread) return;
      thread.innerHTML = `
        <div class="chat-thread-head">
          <div><strong>${escapeHtml(member.displayName || chat.userId)}</strong><div class="small muted">${escapeHtml(chat.userId)}</div></div>
          <div class="toolbar-right">
            ${statusBadge(chat.replyMode)}
            ${human
              ? '<button class="btn btn-secondary btn-small" id="returnAi"><i class="fa-solid fa-robot"></i> ส่งคืน AI</button><button class="btn btn-danger btn-small" id="closeChat"><i class="fa-solid fa-xmark"></i> ปิดแชท</button>'
              : '<button class="btn btn-primary btn-small" id="takeOver"><i class="fa-solid fa-headset"></i> รับช่วง / หยุด AI</button>'}
          </div>
        </div>
        <div class="chat-messages" id="chatMessages">${state.chatMessages.map(messageMarkup).join("")}</div>
        <div class="chat-composer">
          <textarea id="chatInput" class="control" placeholder="${human ? "พิมพ์ข้อความตอบลูกค้า..." : "กดรับช่วงสนทนาก่อนจึงจะส่งข้อความได้"}" ${human ? "" : "disabled"}></textarea>
          <div class="chat-composer-footer">
            <span class="small muted">${human ? "Enter เพื่อส่ง · Shift + Enter เพื่อขึ้นบรรทัดใหม่" : "AI จะหยุดตอบเมื่อแอดมินรับช่วง"}</span>
            <button class="btn btn-primary" id="sendChat" ${human ? "" : "disabled"}><i class="fa-solid fa-paper-plane"></i> ส่งข้อความ</button>
          </div>
        </div>`;
      $("#chatMessages").scrollTop = $("#chatMessages").scrollHeight;
      $("#takeOver")?.addEventListener("click", takeOverChat);
      $("#returnAi")?.addEventListener("click", returnChatToAi);
      $("#closeChat")?.addEventListener("click", closeCurrentChat);
      $("#sendChat")?.addEventListener("click", sendChatMessage);
      $("#chatInput")?.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendChatMessage();
        }
      });
    }

    async function takeOverChat() {
      const agentName = $("#agentName").value.trim() || "Ponlabat";
      try {
        await callApi("chat.accept", {userId:state.chatUserId,agentName});
        notify("รับช่วงสนทนาแล้ว");
        await openChat(state.chatUserId);
      } catch (error) {
        showError(error);
      }
    }

    async function returnChatToAi() {
      if (!(await confirmAction("ส่งคืนให้ AI", "AI จะกลับมาตอบข้อความใหม่จากลูกค้า", "ส่งคืนให้ AI"))) return;
      await callApi("chat.mode", {
        userId:state.chatUserId,
        mode:"AI",
        agentName:$("#agentName").value.trim() || "Ponlabat",
        sendTransitionMessage:true
      });
      notify("ส่งคืนให้ AI แล้ว");
      await openChat(state.chatUserId);
    }

    async function closeCurrentChat() {
      if (!(await confirmAction("ปิดการสนทนา","ต้องการปิดห้องแชทนี้หรือไม่","ปิดแชท"))) return;
      await callApi("chat.close", {
        userId:state.chatUserId,
        agentName:$("#agentName").value.trim() || "Ponlabat"
      });
      notify("ปิดการสนทนาแล้ว");
      await openChat(state.chatUserId);
    }

    async function sendChatMessage() {
      const input = $("#chatInput");
      const text = input.value.trim();
      if (!text || !state.chatUserId) return;

      const agentName = $("#agentName").value.trim() || "Ponlabat";
      const button = $("#sendChat");
      const localMessage = {
        messageId:"local-" + Date.now(),
        senderType:"ADMIN",
        senderName:agentName,
        messageType:"text",
        text,
        deliveryStatus:"กำลังส่ง",
        createdAt:new Date().toISOString()
      };

      // Optimistic UI: display immediately; the network request runs afterward.
      state.chatMessages.push(localMessage);
      $("#chatMessages").insertAdjacentHTML("beforeend", messageMarkup(localMessage));
      $("#chatMessages").scrollTop = $("#chatMessages").scrollHeight;
      input.value = "";
      button.disabled = true;

      try {
        await callApi("chat.send", {userId:state.chatUserId,text,agentName});
        const result = await callApi("chat.messages", {userId:state.chatUserId,limit:100});
        state.chatMessages = result.messages || [];
        const messagesNode = $("#chatMessages");
        if (messagesNode) {
          messagesNode.innerHTML = state.chatMessages.map(messageMarkup).join("");
          messagesNode.scrollTop = messagesNode.scrollHeight;
        }
      } catch (error) {
        const lastBubble = $("#chatMessages")?.lastElementChild;
        const meta = lastBubble ? $(".message-meta",lastBubble) : null;
        if (meta) meta.innerHTML = `<span style="color:#b43e3e">ส่งไม่สำเร็จ: ${escapeHtml(error.message || error)}</span>`;
        notify("ส่งข้อความไม่สำเร็จ", "error");
      } finally {
        if ($("#sendChat")) $("#sendChat").disabled = false;
        if ($("#chatInput")) $("#chatInput").focus();
      }
    }

    async function fileAsDataUrl(file) {
      return new Promise((resolve,reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("อ่านไฟล์ไม่สำเร็จ"));
        reader.readAsDataURL(file);
      });
    }

    async function uploadImage(file, extra = {}) {
      if (!file) throw new Error("กรุณาเลือกไฟล์รูปภาพ");
      if (!file.type.startsWith("image/")) throw new Error("รองรับเฉพาะไฟล์รูปภาพ");
      if (file.size > 8 * 1024 * 1024) throw new Error("ไฟล์ต้องมีขนาดไม่เกิน 8 MB");
      const base64 = await fileAsDataUrl(file);
      return callApi("images.upload", {base64,name:file.name,...extra});
    }

        confirmButtonColor:"#205445",

          $("#selectAllBroadcast").addEventListener("click", () => {

            scheduledAt:$("#broadcastDate").value,

    async function createRichMenuForm() {
      const sample = {

        name:"Main Menu",
        chatBarText:"เมนูหลัก",
        areas:[
          {bounds:{x:0,y:0,width:1250,height:843},action:{type:"message",text:"ดูเมนูอาหาร"}},
          {bounds:{x:1250,y:0,width:1250,height:843},action:{type:"message",text:"ติดต่อเจ้าหน้าที่"}},
          {bounds:{x:0,y:843,width:1250,height:843},action:{type:"message",text:"สั่งอาหารล่วงหน้า"}},

      };

    async function uploadRichMenuImage(richMenuLineId) {
      const result = await Swal.fire({
        title:"อัปโหลดภาพ Rich Menu",
        html:'<div class="field" style="text-align:left"><label>ไฟล์ภาพ PNG หรือ JPEG</label><input id="richMenuFile" type="file" accept="image/png,image/jpeg"></div>',
        showCancelButton:true,
        confirmButtonText:"อัปโหลด",
        cancelButtonText:"ยกเลิก",
        confirmButtonColor:"#205445",
        preConfirm:() => {
          const file = $("#richMenuFile").files[0];
          if (!file) return Swal.showValidationMessage("กรุณาเลือกภาพ");
          return file;
        }
      });
      if (!result.isConfirmed) return;
      try {
        Swal.fire({title:"กำลังอัปโหลด",allowOutsideClick:false,didOpen:() => Swal.showLoading()});
        const base64 = await fileAsDataUrl(result.value);
        await callApi("richMenus.uploadImage",{
          richMenuLineId,
          base64,
          contentType:result.value.type,
          name:result.value.name
        });
        Swal.close();
        notify("อัปโหลดภาพ Rich Menu แล้ว");
      } catch (error) {
        Swal.close();
        showError(error);
      }
    }

      $("#settingsTestImgBB").addEventListener("click", () => testService("system.testImgBB"));
      $("#settingsEditApi").addEventListener("click", () => configureApiConnection(true));
      $("#viewWebhookInstructions").addEventListener("click", async () => {
        try {
          const instructions = await callApi("system.webhookInstructions");
          Swal.fire({
            title:"Webhook และ API Setup",
            width:820,
            html:`
              <div style="text-align:left">
                <div class="field"><label>Dashboard API URL</label><textarea class="control" readonly>${escapeHtml(instructions.apiUrl || "")}</textarea></div>
                <div class="field" style="margin-top:10px"><label>LINE Webhook URL</label><textarea class="control" readonly>${escapeHtml(instructions.webhookUrl || "")}</textarea></div>
                <ol style="text-align:left;padding-left:22px;margin-top:12px">${(instructions.steps || []).map(step => `<li style="margin:6px 0">${escapeHtml(step)}</li>`).join("")}</ol>
              </div>`,
            confirmButtonText:"ปิด",
            confirmButtonColor:"#205445"
          });
        } catch (error) { showError(error); }
      });
    }

    /* -----------------------------------------------------------------------
       Page registry and global event handling
       -------------------------------------------------------------------- */

    const PAGE_RENDERERS = {
      dashboard:renderDashboard,
      ai:renderAi,
      prompts:renderPrompts,
      knowledge:renderKnowledge,
      faq:renderFaq,
      playground:renderPlayground,
      welcome:renderWelcome,
      flex:renderFlex,
      members:renderMembers,
      chat:renderChat,
      handover:renderHandover,
      broadcast:renderBroadcast,
      menu:renderMenu,
      images:renderImages,
      orders:renderOrders,
      keywords:renderKeywords,
      automations:renderAutomations,
      flow:renderFlow,
      richmenus:renderRichMenus,
      staff:renderStaff,
      reports:renderReports,
      logs:renderLogs,
      database:renderDatabase,
      settings:renderSettings
    };

    $$(".nav-link").forEach(button => {
      button.addEventListener("click", () => navigate(button.dataset.page));
    });

    $("#mobileMenu").addEventListener("click", () => {
      $("#sidebar").classList.add("open");
      $("#mobileBackdrop").classList.add("visible");
    });

    $("#mobileBackdrop").addEventListener("click", () => {
      $("#sidebar").classList.remove("open");
      $("#mobileBackdrop").classList.remove("visible");
    });

    $("#refreshButton").addEventListener("click", () => navigate(state.page));
    $("#apiConfigButton").addEventListener("click", () => configureApiConnection(true));

    window.addEventListener("unhandledrejection", event => {
      console.error("Unhandled dashboard error:", event.reason);
      showError(event.reason || new Error("เกิดข้อผิดพลาดที่ไม่คาดคิด"));
      event.preventDefault();
    });

    window.addEventListener("beforeunload", () => {
      if (state.chatRefreshTimer) clearInterval(state.chatRefreshTimer);
    });

    document.addEventListener("DOMContentLoaded", async () => {
      if (!getApiEndpoint()) {
        renderApiSetupRequired();
        await configureApiConnection(true);
        return;
      }
      try {
        const status = await callApi("system.status", {}, {timeoutMs:60000});
        if (status.databaseReady) navigate("dashboard");
        else renderDatabaseSetupRequired();
      } catch (error) {
        renderApiSetupRequired();
        showError(error);
      }
    });
  </script>
</body>
</html>
