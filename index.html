'use strict';
const S={page:'dashboard',system:null,settings:null,members:[],selected:new Set(),flex:[],chats:[],user:'',messages:[],welcome:null,orders:[],prompts:[],knowledge:[],faqs:[],admins:[],groups:[],automations:[],keywords:[],rich:[],logs:[]};
const META={dashboard:'Dashboard',ai:'AI Assistant',knowledge:'คลังความรู้ AI',prompts:'Prompt & Version',playground:'AI Playground',menus:'จัดการเมนูอาหาร',images:'คลังรูปภาพ',welcome:'ข้อความต้อนรับเพื่อนใหม่',flex:'Flex Message Builder',richmenus:'Rich Menu',members:'สมาชิก LINE',chat:'Live Chat',handover:'คิวเจ้าหน้าที่',flows:'Conversation Flow',orders:'รายการสั่งอาหาร',automations:'Automation',keywords:'Keyword Rules',broadcast:'Broadcast',staff:'พนักงานและกลุ่ม LINE',reports:'รายงาน',sheets:'Google Sheets Manager',logs:'System Logs',settings:'ตั้งค่าระบบ'};
function gas(){return !!(window.google&&google.script&&google.script.run)}
function call(action,payload={}){return new Promise((resolve,reject)=>{if(!gas()){reject(new Error('กรุณาเปิดหน้าเว็บผ่าน Apps Script Web App URL ไม่ใช่ GitHub Pages โดยตรง เนื่องจาก google.script.run ทำงานใน HtmlService เท่านั้น'));return;}google.script.run.withSuccessHandler(r=>{if(r&&r.ok===false)reject(new Error(r.error||'Backend error'));else resolve(r||{});}).withFailureHandler(e=>reject(new Error(e&&e.message||String(e)))).api(action,payload||{});});}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return Number(v||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' บาท'}function dt(v){if(!v)return '-';let d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});}function day(v){if(!v)return '-';let d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('th-TH',{dateStyle:'medium'});}
function b(t,c=''){return `<span class="badge ${c}">${esc(t||'-')}</span>`}function st(x){let m={AI:['AI ดูแล','green'],HUMAN:['แอดมินดูแล','blue'],WAITING:['รอเจ้าหน้าที่','yellow'],PAUSED:['หยุดชั่วคราว',''],CLOSED:['ปิดแชท',''],NEW:['ออเดอร์ใหม่','yellow'],ACCEPTED:['รับออเดอร์แล้ว','blue'],COOKING:['กำลังจัดเตรียม','blue'],READY:['พร้อมรับ','green'],COMPLETED:['เสร็จสิ้น',''],CANCELLED:['ยกเลิก','red'],SENT:['ส่งแล้ว','green'],FAILED:['ไม่สำเร็จ','red']};let a=m[String(x||'').toUpperCase()]||[x||'ไม่ระบุ',''];return b(a[0],a[1]);}
function toast(t,icon='success'){Swal.fire({toast:true,position:'top-end',showConfirmButton:false,timer:2600,timerProgressBar:true,icon,title:t});}function err(e){Swal.fire({icon:'error',title:'ดำเนินการไม่สำเร็จ',text:e.message||String(e)});}function loading(t='กำลังดำเนินการ'){document.getElementById('loadingText').textContent=t;document.getElementById('loading').classList.add('show')}function done(){document.getElementById('loading').classList.remove('show')}
async function act(a,p={},t='บันทึกสำเร็จ'){loading();try{let r=await call(a,p);done();if(t)toast(t);return r}catch(e){done();err(e);throw e}}
async function ask(title,text,confirm='ยืนยัน'){let r=await Swal.fire({icon:'question',title,text,showCancelButton:true,confirmButtonText:confirm,cancelButtonText:'ยกเลิก',reverseButtons:true});return r.isConfirmed}
function noData(t='ยังไม่มีข้อมูล'){return `<div class="empty"><i class="fa-regular fa-folder-open"></i>${esc(t)}</div>`}function head(title,desc,buttons=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}function panel(title,body){return `<div class="card"><div class="cardhead"><h2>${title}</h2></div>${body}</div>`}function table(heads,rows){return `<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${heads.length}">${noData()}</td></tr>`}</tbody></table></div>`}function inp(label,id,val='',type='text',hint=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val)}">${hint?`<div class="small muted">${hint}</div>`:''}</div>`}function ta(label,id,val='',hint='',cls=''){return `<div class="field"><label>${label}</label><textarea id="${id}" class="${cls}">${esc(val)}</textarea>${hint?`<div class="small muted">${hint}</div>`:''}</div>`}function sel(label,id,opts,val=''){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(val)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`}function ck(label,id,v){return `<label class="checkline"><input type="checkbox" id="${id}" ${v?'checked':''}>${label}</label>`}function val(id){return document.getElementById(id)?.value||''}function checked(id){return !!document.getElementById(id)?.checked}function jval(x,f=null){try{return JSON.parse(x)}catch(e){return f}}function dataUrl(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function toggleNav(open){document.getElementById('sidebar').classList.toggle('open',!!open);document.getElementById('shade').classList.toggle('show',!!open)}document.getElementById('nav').addEventListener('click',e=>{let x=e.target.closest('[data-page]');if(x)go(x.dataset.page)});function go(p){S.page=p;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('topTitle').textContent=META[p]||p;toggleNav(false);loadPage(p)}function refreshPage(){loadPage(S.page)}function render(html){document.getElementById('content').innerHTML=html+`<div class="footer"><span>LINE AI STUDIO · ก๋วยเตี๋ยวโบราณ by เจ๊อ้น</span><span>Google Apps Script Backend</span></div>`}
async function loadPage(p=S.page){document.getElementById('content').innerHTML='<div class="empty"><span class="spin"></span> กำลังโหลดข้อมูล</div>';let fn={dashboard:dashboard,ai:aiPage,knowledge:knowledgePage,prompts:promptsPage,playground:playground,menus:menusPage,images:imagesPage,welcome:welcomePage,flex:flexPage,richmenus:richPage,members:membersPage,chat:chatPage,handover:handoverPage,flows:flowsPage,orders:ordersPage,automations:automationsPage,keywords:keywordsPage,broadcast:broadcastPage,staff:staffPage,reports:reportsPage,sheets:sheetsPage,logs:logsPage,settings:settingsPage}[p]||dashboard;try{await fn()}catch(e){render(`<div class="card cardbody"><div class="notice danger">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}</div><button class="btn btn-primary mt-3" onclick="refreshPage()">ลองอีกครั้ง</button></div>`);}}

/* Image upload */
async function imagesPage(){let r=await call('images.list',{limit:300});S.images=r.images||[];let cards=S.images.map(x=>`<div class="col-xl-3 col-md-4"><div class="card p-3"><img src="${esc(x.thumbnailUrl||x.imageUrl)}" style="width:100%;height:145px;object-fit:cover;border-radius:9px"><b class="mt-2">${esc(x.name)}</b><span class="small muted">${dt(x.createdAt)}</span><div class="d-flex gap-1 mt-2"><button class="btn btn-sm" onclick="copyText('${esc(x.imageUrl)}')">คัดลอก URL</button><button class="btn btn-sm btn-danger" onclick="delImage('${esc(x.imageId)}')">ลบ</button></div></div></div>`);render(head('คลังรูปภาพ','อัปโหลดรูปอาหารผ่าน ImgBB และเก็บลิงก์ไว้ใน Google Sheets',`<button class="btn btn-primary" onclick="uploadImg()"><i class="fa-solid fa-cloud-arrow-up"></i> อัปโหลดรูป</button>`)+`<div class="notice mb-3">API Key อยู่ฝั่ง Backend เท่านั้น รูปที่อัปโหลดจะบันทึก URL และ Thumbnail ลงใน MENU_IMAGES</div><div class="row g-3">${cards.join('')||noData('ยังไม่มีรูปภาพ')}</div>`)}
async function uploadImg(menuItemId=''){let r=await Swal.fire({title:'อัปโหลดรูปภาพ',showCancelButton:true,confirmButtonText:'อัปโหลด',cancelButtonText:'ยกเลิก',html:`<div class="field"><label>ไฟล์ภาพ</label><input id="img_file" type="file" accept="image/*"></div>${inp('ชื่อภาพ','img_name','food-'+Date.now())}${inp('Menu Item ID (ถ้ามี)','img_menu',menuItemId)}`,preConfirm:()=>{let f=document.getElementById('img_file').files[0];if(!f)return Swal.showValidationMessage('เลือกภาพก่อน');if(f.size>8*1024*1024)return Swal.showValidationMessage('ภาพต้องไม่เกิน 8 MB');return{file:f,name:val('img_name'),menuItemId:val('img_menu')}}});if(!r.isConfirmed)return;try{loading('กำลังอัปโหลดภาพ');let b64=await dataUrl(r.value.file);await call('images.upload',{base64:b64,name:r.value.name,menuItemId:r.value.menuItemId});done();toast('อัปโหลดแล้ว');await imagesPage()}catch(e){done();err(e)}}async function delImage(id){if(await ask('ลบรายการภาพ?','ระบบจะลบข้อมูลภาพออกจากชีต')){await act('images.delete',{imageId:id});await imagesPage()}}function copyText(x){navigator.clipboard?.writeText(x).then(()=>toast('คัดลอกแล้ว')).catch(()=>Swal.fire({title:'URL ภาพ',input:'text',inputValue:x}))}

/* Welcome messages */
async function welcomePage(){let r=await call('welcome.get',{});S.welcome=r;let msgs=r.messages||[];let cards=msgs.map((m,i)=>`<div class="card p-3 d-flex flex-row align-items-start gap-3"><div class="staticon">${i+1}</div><div class="flex-grow-1" style="min-width:0"><b>${esc(m.messageType||m.payload?.type||'Message')}</b> ${m.active?b('เปิด','green'):b('ปิด')}<div class="small muted text-break">${esc(JSON.stringify(m.payload||{}).slice(0,280))}</div><div class="small muted">ลำดับ ${m.sequence||i+1}</div></div><div class="d-flex gap-1 flex-wrap"><button class="btn btn-sm" onclick="editWelcome(${i})"><i class="fa-solid fa-pen"></i></button><button class="btn btn-sm" onclick="moveWelcome(${i},-1)" ${i===0?'disabled':''}><i class="fa-solid fa-arrow-up"></i></button><button class="btn btn-sm" onclick="moveWelcome(${i},1)" ${i===msgs.length-1?'disabled':''}><i class="fa-solid fa-arrow-down"></i></button><button class="btn btn-sm btn-danger" onclick="removeWelcome(${i})"><i class="fa-solid fa-trash"></i></button></div></div>`);render(head('ข้อความต้อนรับเพื่อนใหม่','กำหนดชุดข้อความหลายรายการและส่งทันทีเมื่อมี Follow Event',`<button class="btn" onclick="testWelcome()">ทดลองส่ง</button><button class="btn btn-primary" onclick="saveWelcome()">บันทึกชุดต้อนรับ</button>`)+`<div class="row g-3 mb-3"><div class="col-lg-6">${panel('การตั้งค่า',`<div class="cardbody">${ck('เปิดใช้งานข้อความต้อนรับ','w_enabled',r.settings.enabled)}${ck('ส่งเฉพาะการเพิ่มเพื่อนครั้งแรก','w_first',r.settings.sendOnlyFirstFollow)}${inp('จำนวน Message Objects สูงสุด ไม่เกิน 5','w_max',r.settings.maxReplyMessages,'number')}<div class="notice">LINE Reply API รองรับสูงสุด 5 Message Objects ต่อคำขอ Flex Carousel สามารถรวมหลายการ์ดใน Message Object เดียวได้</div></div>`)}</div><div class="col-lg-6">${panel('เพิ่มรายการข้อความ',`<div class="cardbody d-flex gap-2 flex-wrap"><button class="btn btn-soft" onclick="addWelcomeText()">เพิ่ม Text</button><button class="btn btn-soft" onclick="addWelcomeImage()">เพิ่ม Image</button><button class="btn btn-soft" onclick="addWelcomeFlex()">เพิ่ม Flex JSON</button><div class="notice warn w-100">การจัดเรียงด้านล่างคือ ลำดับที่ Backend จะส่งให้ผู้ใช้หลังเพิ่มเพื่อน</div></div>`)}</div></div><div class="d-grid gap-2">${cards.join('')||noData('ยังไม่มีข้อความต้อนรับ')}</div>`)}
async function addWelcomeText(){let r=await Swal.fire({title:'เพิ่ม Text',input:'textarea',inputPlaceholder:'ข้อความต้อนรับ',showCancelButton:true,confirmButtonText:'เพิ่ม'});if(!r.isConfirmed||!r.value)return;S.welcome.messages.push({sequence:S.welcome.messages.length+1,messageType:'text',active:true,payload:{type:'text',text:r.value}});await welcomePage()}
async function addWelcomeImage(){let r=await Swal.fire({title:'เพิ่ม Image',showCancelButton:true,confirmButtonText:'เพิ่ม',html:inp('HTTPS Image URL','wi_url','')+inp('Preview URL (ไม่บังคับ)','wi_preview',''),preConfirm:()=>({url:val('wi_url'),preview:val('wi_preview')})});if(!r.isConfirmed)return;if(!/^https:\/\//i.test(r.value.url)){Swal.fire('URL ไม่ถูกต้อง','ต้องเป็น HTTPS URL','warning');return}S.welcome.messages.push({sequence:S.welcome.messages.length+1,messageType:'image',active:true,payload:{type:'image',originalContentUrl:r.value.url,previewImageUrl:r.value.preview||r.value.url}});await welcomePage()}
async function addWelcomeFlex(){let sample={type:'flex',altText:'ยินดีต้อนรับสู่ร้านเจ๊อ้น',contents:{type:'bubble',body:{type:'box',layout:'vertical',contents:[{type:'text',text:'ยินดีต้อนรับสู่ร้านก๋วยเตี๋ยวโบราณ by เจ๊อ้น',weight:'bold',wrap:true}]}}};let r=await Swal.fire({title:'เพิ่ม Flex Message',width:850,showCancelButton:true,confirmButtonText:'เพิ่ม',html:ta('LINE Message Object JSON','wf_json',JSON.stringify(sample,null,2),'ต้องมี type:flex และ contents','json'),preConfirm:()=>{let o=jval(val('wf_json'));if(!o?.type)return Swal.showValidationMessage('JSON ไม่ถูกต้อง');return o}});if(!r.isConfirmed)return;S.welcome.messages.push({sequence:S.welcome.messages.length+1,messageType:r.value.type,active:true,payload:r.value});await welcomePage()}
async function editWelcome(i){let x=S.welcome.messages[i];let r=await Swal.fire({title:'แก้ไข Welcome Message',width:850,showCancelButton:true,confirmButtonText:'บันทึก',html:ta('LINE Message JSON','we_json',JSON.stringify(x.payload||{},null,2),'Message Object ของ LINE','json')+ck('เปิดใช้งาน','we_active',x.active!==false),preConfirm:()=>{let o=jval(val('we_json'));if(!o?.type)return Swal.showValidationMessage('JSON ไม่ถูกต้อง');return{payload:o,active:checked('we_active')}}});if(!r.isConfirmed)return;Object.assign(x,{payload:r.value.payload,messageType:r.value.payload.type,active:r.value.active});await welcomePage()}
function moveWelcome(i,d){let a=S.welcome.messages,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];a.forEach((x,k)=>x.sequence=k+1);welcomePage()}function removeWelcome(i){S.welcome.messages.splice(i,1);S.welcome.messages.forEach((x,k)=>x.sequence=k+1);welcomePage()}
async function saveWelcome(){let messages=(S.welcome.messages||[]).map((x,i)=>({welcomeMessageId:x.welcomeMessageId,sequence:i+1,messageType:x.messageType||x.payload?.type,payload:x.payload||jval(x.payloadJson,{}),active:x.active!==false,createdAt:x.createdAt}));await act('welcome.save',{settings:{enabled:checked('w_enabled'),sendOnlyFirstFollow:checked('w_first'),maxReplyMessages:Math.min(5,Math.max(1,Number(val('w_max')||5)))},messages});await welcomePage()}
async function testWelcome(){let r=await Swal.fire({title:'ส่งทดสอบ Welcome',input:'text',inputLabel:'LINE User ID ผู้รับทดสอบ',showCancelButton:true,confirmButtonText:'ส่งทดสอบ'});if(!r.isConfirmed||!r.value)return;await act('welcome.test',{userId:r.value},'ส่งทดสอบแล้ว')}

/* Flex templates */
async function flexPage(){let r=await call('flex.list',{});S.flex=r.templates||[];let rows=S.flex.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category||'-')}</td><td>${x.active?b('เปิด','green'):b('ปิด')}</td><td>${dt(x.updatedAt)}</td><td><button class="btn btn-sm" onclick="editFlex('${esc(x.templateId)}')">แก้ไข</button> <button class="btn btn-sm" onclick="previewFlex('${esc(x.templateId)}')">ดู JSON</button> <button class="btn btn-sm btn-danger" onclick="delFlex('${esc(x.templateId)}')">ลบ</button></td></tr>`);render(head('Flex Message Builder','สร้าง Flex JSON, จัดเก็บเป็น Template และนำไปส่งให้สมาชิก',`<button class="btn btn-primary" onclick="editFlex()">สร้าง Flex</button>`)+`<div class="notice mb-3">ตัวแก้ไขนี้เก็บ Flex Contents JSON ของ LINE เพื่อรองรับ Bubble, Carousel, Image, Button และ Action อย่างยืดหยุ่น</div>${panel('Flex Templates',table(['ชื่อ','หมวดหมู่','สถานะ','ปรับปรุงล่าสุด','จัดการ'],rows))}`)}
function sampleFlex(){return{type:'bubble',hero:{type:'image',url:'https://example.com/food.jpg',size:'full',aspectRatio:'20:13',aspectMode:'cover'},body:{type:'box',layout:'vertical',contents:[{type:'text',text:'เมนูแนะนำจากเจ๊อ้น',weight:'bold',size:'xl',wrap:true},{type:'text',text:'ก๋วยเตี๋ยวโบราณ รสชาติต้นตำรับ',size:'sm',color:'#777777',wrap:true}]},footer:{type:'box',layout:'vertical',contents:[{type:'button',style:'primary',color:'#286b57',action:{type:'uri',label:'ดูเมนูอาหาร',uri:'https://example.com'}}]}}}
async function editFlex(id=''){let x=S.flex.find(a=>a.templateId===id)||{};let r=await Swal.fire({title:id?'แก้ไข Flex':'สร้าง Flex',width:900,showCancelButton:true,confirmButtonText:'บันทึก Template',html:inp('ชื่อ Template','fx_name',x.name||'Flex เมนูแนะนำ')+inp('Alt Text','fx_alt',x.altText||'ข้อความจากร้านก๋วยเตี๋ยวโบราณ by เจ๊อ้น')+inp('หมวดหมู่','fx_cat',x.category||'GENERAL')+ta('Contents JSON (Bubble หรือ Carousel)','fx_json',JSON.stringify(x.contents||sampleFlex(),null,2),'ใส่เฉพาะ Flex Contents ไม่ต้องครอบด้วย type:flex','json')+ck('เปิดใช้งาน','fx_active',x.active!==false),preConfirm:()=>{let o=jval(val('fx_json'));if(!o?.type)return Swal.showValidationMessage('Flex JSON ไม่ถูกต้อง');return{templateId:id||undefined,name:val('fx_name'),altText:val('fx_alt'),category:val('fx_cat'),contents:o,active:checked('fx_active')}}});if(!r.isConfirmed)return;await act('flex.save',r.value);await flexPage()}
async function previewFlex(id){let x=S.flex.find(a=>a.templateId===id);if(x)Swal.fire({title:esc(x.name),width:850,html:`<pre class="jsonpreview">${esc(JSON.stringify(x.contents,null,2))}</pre>`})}async function delFlex(id){if(await ask('ลบ Flex Template?','ยืนยันการลบ')){await act('flex.delete',{templateId:id});await flexPage()}}

/* Members and selectable Flex broadcast */
async function membersPage(q=''){let r=await call('members.list',{query:q,limit:500});S.members=r.members||[];let rows=S.members.map(m=>{let tags=jval(m.tagsJson,[])||[];return `<tr><td><input type="checkbox" class="membercheck" value="${esc(m.userId)}" ${S.selected.has(m.userId)?'checked':''} onchange="selectMember(this)"></td><td><div class="member">${m.pictureUrl?`<img class="avatar" src="${esc(m.pictureUrl)}">`:`<span class="avatar"><i class="fa-solid fa-user"></i></span>`}<div><b>${esc(m.displayName||'LINE User')}</b><div class="small muted">${esc(m.userId)}</div></div></div></td><td>${day(m.followedAt||m.createdAt)}</td><td>${tags.map(t=>b(t,'blue')).join(' ')||'-'}</td><td>${esc(m.source||'-')}</td><td><button class="btn btn-sm" onclick="editMember('${esc(m.userId)}')">แก้ไข</button> <button class="btn btn-sm" onclick="memberProfile('${esc(m.userId)}')">ข้อมูล</button></td></tr>`});render(head('สมาชิก LINE','ดูรายชื่อเพื่อน ค้นหา เลือกหลายคน และส่ง Flex Message',`<button class="btn" onclick="syncMembers()"><i class="fa-solid fa-arrows-rotate"></i> Sync เพื่อน</button><button class="btn btn-primary" onclick="sendSelectedFlex()"><i class="fa-regular fa-paper-plane"></i> ส่ง Flex ที่เลือก</button>`)+`<div class="card"><div class="toolbar"><div class="search"><i class="fa-solid fa-search"></i><input id="memberSearch" class="control" placeholder="ค้นหาชื่อหรือ User ID" value="${esc(q)}" onkeydown="if(event.key==='Enter')membersPage(this.value)"></div><div class="d-flex gap-2 align-items-center"><span class="small muted">ทั้งหมด ${r.total||0} รายชื่อ · เลือก ${S.selected.size} คน</span><button class="btn btn-sm" onclick="selectVisible(true)">เลือกทั้งหมด</button><button class="btn btn-sm" onclick="selectVisible(false)">ล้างเลือก</button></div></div>${table(['เลือก','สมาชิก','วันที่เพิ่มเพื่อน','Tag','แหล่งข้อมูล','จัดการ'],rows)}<div class="toolbar"><span class="small muted">เลือก ${S.selected.size} คน</span><button class="btn btn-primary" onclick="sendSelectedFlex()">ส่ง Flex ให้สมาชิกที่เลือก</button></div></div><div class="notice warn mt-3">Followers API สำหรับดึงเพื่อนเก่าทั้งหมดใช้ได้กับบัญชี LINE OA ที่ได้รับสิทธิ์ Verified หรือ Premium เท่านั้น ระบบจะบันทึกสมาชิกจาก Follow และ Message Webhook ด้วย</div>`)}
function selectMember(el){el.checked?S.selected.add(el.value):S.selected.delete(el.value)}function selectVisible(flag){S.members.forEach(m=>flag?S.selected.add(m.userId):S.selected.delete(m.userId));document.querySelectorAll('.membercheck').forEach(x=>x.checked=flag)}async function syncMembers(){let r=await act('members.sync',{limit:40},'Sync รายชื่อแล้ว');Swal.fire({icon:r.ok?'success':'warning',title:'ผลการ Sync',text:r.message||r.hint||JSON.stringify(r)});await membersPage()}
async function editMember(id){let m=S.members.find(x=>x.userId===id)||{};let r=await Swal.fire({title:'แก้ไขสมาชิก',showCancelButton:true,confirmButtonText:'บันทึก',html:inp('ชื่อแสดง','mb_name',m.displayName||'')+inp('Tag คั่นด้วยเครื่องหมายจุลภาค','mb_tags',(jval(m.tagsJson,[])||[]).join(', '))+ta('หมายเหตุ','mb_note',m.note||''),preConfirm:()=>({userId:id,displayName:val('mb_name'),tags:val('mb_tags').split(',').map(x=>x.trim()).filter(Boolean),note:val('mb_note')})});if(!r.isConfirmed)return;await act('members.save',r.value);await membersPage()}
async function memberProfile(id){let r=await call('members.profile',{userId:id});let p=r.profile||r.stored||{};Swal.fire({title:esc(p.displayName||'ข้อมูลสมาชิก'),html:`<div class="text-start"><div class="small muted">LINE User ID</div>${esc(id)}<div class="small muted mt-2">เพิ่มเพื่อน</div>${dt(p.followedAt)}<div class="small muted mt-2">สถานะ</div>${p.isBlocked?'บล็อก':'ใช้งาน'}</div>`})}
async function sendSelectedFlex(){let ids=[...S.selected];if(!ids.length){toast('กรุณาเลือกสมาชิก','warning');return}if(!S.flex.length)await flexPageData();let opts=S.flex.filter(x=>x.active!==false).map(x=>`<option value="${esc(x.templateId)}">${esc(x.name)}</option>`).join('');if(!opts){Swal.fire('ไม่มี Flex Template','กรุณาสร้าง Flex Template ก่อน');return}let r=await Swal.fire({title:'ส่ง Flex Message',html:`<div class="field"><label>Flex Template</label><select id="sendTemplate">${opts}</select></div><div class="notice">ผู้รับ ${ids.length} คน ระบบใช้ LINE Multicast และบันทึกผลส่งแยกรายบุคคล</div>`,showCancelButton:true,confirmButtonText:'ส่ง Flex'});if(!r.isConfirmed)return;if(!await ask('ยืนยันส่ง Flex?',`ส่ง Flex ให้สมาชิก ${ids.length} คนหรือไม่`,'ยืนยันส่ง'))return;let out=await act('flex.send',{userIds:ids,templateId:val('sendTemplate')},'ส่งคำขอเรียบร้อย');Swal.fire({icon:out.ok?'success':'warning',title:'ผลการส่ง',html:`สำเร็จ ${out.sent||0} คน<br>ล้มเหลว ${out.failed||0} คน`})}
async function flexPageData(){let r=await call('flex.list',{});S.flex=r.templates||[]}

/* Live Chat */
async function chatPage(){let r=await call('chat.list',{limit:250});S.chats=r.chats||[];let items=S.chats.map(c=>`<button class="chatitem ${c.userId===S.user?'active':''}" onclick="openChat('${esc(c.userId)}')"><span class="avatar"><i class="fa-solid fa-user"></i></span><span class="chatinfo"><span class="chatname d-block">${esc(c.member?.displayName||c.userId)}</span><span class="chatlast">${esc(c.replyMode)} · ${dt(c.lastMessageAt)}</span></span>${Number(c.unreadCount||0)?b(c.unreadCount,'green'):''}</button>`).join('');let current=S.chats.find(c=>c.userId===S.user);let thread=current?`<div class="chatwindow"><div class="chathead"><div><b>${esc(current.member?.displayName||S.user)}</b><div class="small muted">${esc(S.user)}</div></div><div>${st(current.replyMode)}</div></div><div class="messages" id="chatMessages">${messageBubbles(S.messages)}</div><div class="compose"><div class="d-flex gap-2 flex-wrap mb-2"><button class="btn btn-sm" onclick="changeMode('PAUSED')">หยุด AI</button><button class="btn btn-sm btn-primary" onclick="changeMode('HUMAN')">รับช่วงเป็นแอดมิน</button><button class="btn btn-sm btn-soft" onclick="changeMode('AI')">ส่งคืนให้ AI</button><button class="btn btn-sm btn-danger" onclick="changeMode('CLOSED')">ปิดแชท</button></div><div class="compose-row"><textarea id="chatInput" placeholder="พิมพ์ข้อความตอบลูกค้า" onkeydown="chatEnter(event)"></textarea><button class="send" id="sendChat" onclick="sendChat()"><i class="fa-solid fa-paper-plane"></i></button></div><div class="small muted mt-1">Enter เพื่อส่ง · Shift + Enter เพื่อขึ้นบรรทัดใหม่</div></div></div>`:`<div class="chatwindow"><div class="empty"><i class="fa-regular fa-comments"></i>เลือกห้องสนทนาเพื่อเริ่มตอบลูกค้า</div></div>`;render(head('Live Chat','ตอบลูกค้าแบบแอดมิน หยุด AI และส่งคืนให้ AI รายบุคคล',`<button class="btn" onclick="chatPage()">รีเฟรช</button>`)+`<div class="card chatlayout"><div class="chatlist"><div class="p-3 border-bottom"><input class="control" placeholder="ค้นหาห้องแชท" oninput="filterChats(this.value)"></div><div id="chatItems">${items||noData('ยังไม่มีห้องแชท')}</div></div>${thread}</div>`);if(S.user)scrollMessages()}
function messageBubbles(a){if(!a?.length)return noData('ยังไม่มีข้อความ');return a.map(x=>`<div class="bubble ${x.senderType==='USER'?'user':'admin'}">${esc(x.text||'['+(x.messageType||'message')+']')}<div class="bubblemeta">${esc(x.senderName||x.senderType||'')} · ${dt(x.createdAt)} · ${esc(x.deliveryStatus||'')}</div></div>`).join('')}
function filterChats(q){document.querySelectorAll('#chatItems .chatitem').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q.toLowerCase())?'flex':'none')}
async function openChat(id){S.user=id;let r=await call('chat.messages',{userId:id,limit:120});S.messages=r.messages||[];await chatPage()}
function scrollMessages(){let x=document.getElementById('chatMessages');if(x)x.scrollTop=x.scrollHeight}
async function reloadMessages(){if(!S.user)return;let r=await call('chat.messages',{userId:S.user,limit:120});S.messages=r.messages||[];let x=document.getElementById('chatMessages');if(x){x.innerHTML=messageBubbles(S.messages);scrollMessages()}}
function chatEnter(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}}
async function sendChat(){let text=val('chatInput').trim();if(!text||!S.user)return;let local={messageId:'local-'+Date.now(),senderType:'ADMIN',senderName:'Ponlabat',text,deliveryStatus:'SENDING',createdAt:new Date().toISOString()};S.messages.push(local);let box=document.getElementById('chatMessages');box.innerHTML=messageBubbles(S.messages);scrollMessages();document.getElementById('chatInput').value='';let btn=document.getElementById('sendChat');btn.disabled=true;try{let r=await call('chat.send',{userId:S.user,text,agentName:'Ponlabat'});local.deliveryStatus='SENT';local.messageId=r.messageId||local.messageId;box.innerHTML=messageBubbles(S.messages);scrollMessages()}catch(e){local.deliveryStatus='FAILED';box.innerHTML=messageBubbles(S.messages);err(e)}finally{btn.disabled=false}}
async function changeMode(mode){if(!S.user)return;let agent='Ponlabat';if(mode==='HUMAN'){let r=await Swal.fire({title:'รับช่วงสนทนา',input:'text',inputValue:'Ponlabat',inputLabel:'ชื่อผู้ให้บริการ',showCancelButton:true,confirmButtonText:'รับช่วง'});if(!r.isConfirmed)return;agent=r.value||'Ponlabat'}if(!await ask('เปลี่ยนโหมดแชท?',`ต้องการเปลี่ยนเป็น ${mode} หรือไม่`))return;await act(mode==='HUMAN'?'chat.accept':'chat.mode',{userId:S.user,mode,agentName:agent,sendTransitionMessage:mode==='AI'},'เปลี่ยนโหมดแล้ว');await chatPage()}

/* Rich Menu */
async function richPage(){let r=await call('richMenus.list',{});S.rich=r.richMenus||[];let rows=S.rich.map(x=>`<tr><td>${esc(x.name)}</td><td><code>${esc(x.richMenuLineId)}</code></td><td>${x.isDefault?b('ค่าเริ่มต้น','green'):'-'}</td><td><button class="btn btn-sm" onclick="uploadRichImage('${esc(x.richMenuLineId)}')">อัปโหลดภาพ</button> <button class="btn btn-sm" onclick="makeRichDefault('${esc(x.richMenuLineId)}')">ตั้งค่าเริ่มต้น</button> <button class="btn btn-sm btn-danger" onclick="removeRich('${esc(x.richMenuLineId)}')">ลบ</button></td></tr>`);render(head('Rich Menu','สร้างเมนูถาวรด้านล่างห้องแชท LINE OA',`<button class="btn btn-primary" onclick="createRich()">สร้าง Rich Menu</button>`)+panel('Rich Menu ที่จัดการไว้',table(['ชื่อ','LINE Rich Menu ID','ค่าเริ่มต้น','จัดการ'],rows))+`<div class="notice warn mt-3">หลังสร้าง Rich Menu ต้องอัปโหลดภาพขนาดตรงกับ size ผ่าน API และสามารถตั้งเป็นเมนูเริ่มต้นสำหรับผู้ใช้ทั้งหมดได้</div>`)}
async function createRich(){let sample={size:{width:2500,height:1686},selected:true,name:'เมนูร้านเจ๊อ้น',chatBarText:'เมนูร้าน',areas:[{bounds:{x:0,y:0,width:1250,height:843},action:{type:'message',text:'ดูเมนูอาหาร'}},{bounds:{x:1250,y:0,width:1250,height:843},action:{type:'message',text:'ติดต่อเจ้าหน้าที่'}},{bounds:{x:0,y:843,width:1250,height:843},action:{type:'message',text:'สั่งอาหารล่วงหน้า'}},{bounds:{x:1250,y:843,width:1250,height:843},action:{type:'message',text:'โปรโมชั่น'}}]};let r=await Swal.fire({title:'สร้าง Rich Menu',width:850,showCancelButton:true,confirmButtonText:'สร้างใน LINE',html:inp('ชื่อ','rm_name',sample.name)+ta('Rich Menu JSON','rm_json',JSON.stringify(sample,null,2),'ต้องมี size และ areas','json'),preConfirm:()=>{let x=jval(val('rm_json'));if(!x?.size||!Array.isArray(x.areas))return Swal.showValidationMessage('JSON ไม่ถูกต้อง');return{name:val('rm_name'),richMenu:x}}});if(!r.isConfirmed)return;let x=await act('richMenus.create',r.value,'สร้าง Rich Menu แล้ว');Swal.fire('สร้างสำเร็จ','LINE Rich Menu ID: '+x.richMenuLineId,'success');await richPage()}
async function uploadRichImage(id){let r=await Swal.fire({title:'อัปโหลดภาพ Rich Menu',showCancelButton:true,confirmButtonText:'อัปโหลด',html:`<div class="field"><label>ไฟล์ภาพ PNG/JPEG</label><input id="rmi_file" type="file" accept="image/png,image/jpeg"></div>`,preConfirm:()=>{let f=document.getElementById('rmi_file').files[0];if(!f)return Swal.showValidationMessage('เลือกภาพก่อน');return f}});if(!r.isConfirmed)return;try{loading('อัปโหลดภาพ');let b64=await dataUrl(r.value);await call('richMenus.uploadImage',{richMenuLineId:id,base64:b64,contentType:r.value.type,name:r.value.name});done();toast('อัปโหลดภาพแล้ว')}catch(e){done();err(e)}}async function makeRichDefault(id){if(await ask('ตั้งเป็น Rich Menu เริ่มต้น?','มีผลกับผู้ใช้ทั้งหมด')){await act('richMenus.default',{richMenuLineId:id});await richPage()}}async function removeRich(id){if(await ask('ลบ Rich Menu?','จะส่งคำสั่งลบไปยัง LINE')){await act('richMenus.delete',{richMenuLineId:id});await richPage()}}

/* Reports, sheets, logs, flow */
async function reportsPage(){let r=await call('reports.get',{}),s=r.summary||{};let items=[['จำนวนออเดอร์',s.orders,'fa-receipt'],['ยอดขายสะสม',money(s.revenue),'fa-sack-dollar'],['ข้อความ AI',s.aiMessages,'fa-robot'],['ข้อความแอดมิน',s.adminMessages,'fa-headset']];render(head('รายงาน','สรุปตัวชี้วัดจากออเดอร์และประวัติแชท',`<button class="btn" onclick="reportsPage()">รีเฟรช</button>`)+`<div class="row g-3 gridstat">${items.map(x=>`<div class="col-md-3"><div class="card stat"><div class="statlabel">${x[0]}<span class="staticon"><i class="fa-solid ${x[2]}"></i></span></div><div class="statvalue">${x[1]??0}</div><div class="statfoot">ข้อมูล ณ ${esc(s.today||'-')}</div></div></div>`).join('')}</div><div class="notice mt-3">Reports API ใน Code.gs ปัจจุบันส่งยอดสรุปและ Metrics ที่บันทึกใน ANALYTICS ยังไม่มีการกรองช่วงวันที่หรือข้อมูลกราฟละเอียด</div>`)}
async function sheetsPage(){let s=await call('system.status',{});render(head('Google Sheets Manager','ตรวจสอบ Spreadsheet หลักและสถานะบริการ',`<button class="btn" onclick="sheetsPage()">ตรวจสอบอีกครั้ง</button>`)+`<div class="row g-3"><div class="col-md-6">${panel('ฐานข้อมูลหลัก',`<div class="cardbody">${s.databaseReady?b('เชื่อมต่อแล้ว','green'):b('ยังไม่สร้างฐานข้อมูล','red')}<div class="small muted mt-3">Spreadsheet ID</div><code>${esc(s.spreadsheetId||'-')}</code>${s.spreadsheetUrl?`<a class="btn btn-primary d-block mt-3" href="${esc(s.spreadsheetUrl)}" target="_blank">เปิด Google Sheets</a>`:''}<div class="notice mt-3">ครั้งแรกให้รัน setupSystem() ใน Apps Script Editor เพื่อสร้าง Spreadsheet และหัวตารางอัตโนมัติ</div></div>`)}</div><div class="col-md-6">${panel('สถานะการเชื่อมต่อ',`<div class="cardbody">${[['LINE',s.lineConfigured],['Gemini',s.geminiConfigured],['ImgBB',s.imgbbConfigured],['Webhook Secret',s.webhookSecretConfigured]].map(x=>`<div class="d-flex justify-content-between border-bottom py-2">${x[0]}${x[1]?b('ตั้งค่าแล้ว','green'):b('ยังไม่ตั้งค่า','red')}</div>`).join('')}</div>`)}</div></div><div class="notice warn mt-3">การสำรองข้อมูลให้ทำสำเนา Spreadsheet หรือดาวน์โหลดเป็น XLSX เป็นระยะ Backend นี้ยังไม่มี API Export / Restore บน Dashboard</div>`)}
async function logsPage(){let r=await call('logs.list',{limit:250});S.logs=r.logs||[];let rows=S.logs.map(x=>`<tr><td>${dt(x.createdAt)}</td><td>${b(x.level,x.level==='ERROR'?'red':x.level==='WARN'?'yellow':'')}</td><td>${esc(x.module)}</td><td>${esc(x.message)}</td><td><button class="btn btn-sm" onclick="viewLog('${esc(x.logId)}')">ดูรายละเอียด</button></td></tr>`);render(head('System Logs','ติดตาม Error, Warning และประวัติการทำงาน',`<button class="btn" onclick="logsPage()">รีเฟรช</button>`)+panel('รายการ Log',table(['เวลา','Level','Module','ข้อความ','รายละเอียด'],rows)))}function viewLog(id){let x=S.logs.find(a=>a.logId===id);if(x)Swal.fire({title:'รายละเอียด Log',width:800,html:`<div class="text-start"><p><b>${esc(x.module)}</b> · ${esc(x.level)}</p><p>${esc(x.message)}</p><pre class="jsonpreview">${esc(x.detail||'ไม่มีรายละเอียด')}</pre></div>`})}
async function flowsPage(){render(head('Conversation Flow','วางแผนลำดับบทสนทนาของ AI',`<button class="btn" disabled>สร้าง Flow</button>`)+`<div class="card cardbody"><div class="notice warn"><b>Backend ปัจจุบันยังไม่มี API สำหรับ Conversation Flow Builder</b><br>Code.gs มี Automation และ Keyword Rules แต่ยังไม่มีตารางและ action สำหรับบันทึก Node, Connection หรือ Flow Graph จึงไม่แสดงปุ่มบันทึกที่ยังใช้งานไม่ได้</div><div class="row g-3 mt-2"><div class="col-md-4"><div class="border rounded p-3"><i class="fa-solid fa-comment-dots"></i><b class="d-block">Trigger</b><span class="small muted">Follow / Message / Keyword</span></div></div><div class="col-md-4"><div class="border rounded p-3"><i class="fa-solid fa-code-branch"></i><b class="d-block">Condition</b><span class="small muted">ตรวจสอบเจตนาและข้อมูล</span></div></div><div class="col-md-4"><div class="border rounded p-3"><i class="fa-solid fa-arrow-right-arrow-left"></i><b class="d-block">Action</b><span class="small muted">AI / Order / Handover</span></div></div></div><div class="mt-3"><button class="btn btn-soft" onclick="go('automations')">ไปที่ Automation</button> <button class="btn" onclick="go('keywords')">ไปที่ Keyword Rules</button></div></div>`)}
</script>
